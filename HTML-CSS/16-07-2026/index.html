<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <title>Pseudo-classes</title>
  </head>
  <body>
    <div class="container">box</div>

    <div class="box-container">
      <div class="box">box 1</div>
      <section class="box">box 2</section>
      <div class="box">box 3</div>
      <section class="box">box 4</section>
      <div class="box">box 5</div>
      <section class="box">box 6</section>
      <div class="box">box 7</div>
      <section class="box">box 8</section>
    </div>

    <p class="para">
      <span class="text"
        >Lorem, ipsum dolor sit amet consectetur adipisicing elit.</span
      >
      <a class="text">Register</a>
    </p>

    <div class="boxes">
      <section class="boxx">box 1</section>
      <div class="boxx">box 2</div>
      <section class="boxx">box 3</section>
      <div class="boxx">box 4</div>
      <section class="boxx">box 5</section>
      <div class="boxx">box 3</div>
      <section class="boxx">box 6</section>
      <div class="boxx">box 7</div>
      <article class="boxx">box 8</article>
      <article class="boxx">box 9</article>
      <article class="boxx">box 10</article>
    </div>

    <form class="login-form">
      <input class="input" type="email" placeholder="enter email" />
      <input class="input" type="password" placeholder="enter password" />
      <button class="btn">Submit</button>
    </form>
  </body>
</html>
